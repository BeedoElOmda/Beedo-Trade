name: Build Windows app

# Builds the Windows installer on GitHub's Windows machines with the same script used locally (app/packaging/build.ps1).
# Runs when a release is published (the installer is attached to it), or by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the installer to (e.g. v1.5.0). Leave empty to only build."
        required: false

permissions:
  contents: write   # needed to attach files to a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build, test and package
        working-directory: app
        shell: pwsh
        run: ./packaging/build.ps1
      - id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Beedo-Trade-windows
          path: |
            app/dist/*.exe
            app/dist/*.zip
          if-no-files-found: error
      # Code signing by SignPath Foundation (each request is approved by hand in SignPath).
      # Active once the repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      # SIGNPATH_POLICY_SLUG and the secret SIGNPATH_API_TOKEN are set; skipped until then.
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: app/dist-signed
      - name: Use the signed files
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: cp -f app/dist-signed/* app/dist/
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # No --clobber: an installer already attached by hand is kept
        run: |
          for f in app/dist/*.exe app/dist/*.zip; do
            gh release upload "$TAG" "$f" || echo "$(basename "$f") is already attached to $TAG; kept it."
          done
