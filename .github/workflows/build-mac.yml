name: Build macOS app

# Builds Beedo-Trade for Mac on GitHub's Mac machines (PyInstaller can't build Mac apps on Windows).
# Runs when a release is published (the .dmg files are attached to it), or by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the .dmg to (e.g. v1.4.0). Leave empty to only build."
        required: false

permissions:
  contents: write   # needed to attach files to a release

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build, test and package
        working-directory: app
        run: bash packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Beedo-Trade-${{ matrix.os }}
          path: app/dist/*.dmg
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" app/dist/*.dmg --clobber
