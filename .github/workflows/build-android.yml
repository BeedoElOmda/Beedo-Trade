name: Build Android app

# Builds the Android test app (an APK anyone can install, signed with a test key) with BeeWare Briefcase.
# Runs when a release is published (the APK is attached to it), or by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (e.g. v2.0.0). Leave empty to only build."
        required: false

permissions:
  contents: write   # needed to attach files to a release

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_UPLOAD_KEYSTORE != '' }}  # your Google Play upload key (mobile/play/make_upload_key.py)
    steps:  # build only; the test job below attaches the APK once it starts cleanly
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Copy the desktop engine and screens into the phone project
        run: |
          cp LICENSE mobile/
          cp -r app/beedo_app mobile/src/beedo_app
          mkdir -p mobile/src/beedotrade/engine
          cp skills/beedo-trade/scripts/{analyze,dividends,fundamentals,metals,timemachine}.py mobile/src/beedotrade/engine/
          VERSION=$(grep -m1 '^version' app/pyproject.toml | cut -d'"' -f2)
          sed -i "s/^version = \"0.0.0\"/version = \"$VERSION\"/" mobile/pyproject.toml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: mobile
        run: |
          pip install briefcase
          briefcase create android --no-input
          # Title bar and status bar in the icon blue (the template's default is Material purple)
          C=build/beedotrade/android/gradle/app/src/main/res/values/colors.xml
          sed -i -E 's|(name="colorPrimary">)[^<]*|\1#1D45A7|; s|(name="colorPrimaryDark">)[^<]*|\1#3F70E6|; s|(name="colorAccent">)[^<]*|\1#109EA5|' "$C"
          cat "$C"
          # Daily alert check and notifications: the Java job, and the permission to show notifications (Android 13+)
          J=build/beedotrade/android/gradle/app/src/main/java/io/github/beedoelomda/beedotrade
          mkdir -p "$J" && cp android/AlertWorker.java "$J/"
          M=build/beedotrade/android/gradle/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$M"
          grep -n "POST_NOTIFICATIONS" "$M"
          briefcase build android --no-input
          briefcase package android -p debug-apk --no-input
          mkdir -p ../out && cp dist/*.apk "../out/Beedo-Trade-${VERSION}-android.apk"
      # Google Play takes an .aab bundle signed with your upload key. Without the key (GitHub secrets PLAY_UPLOAD_KEYSTORE
      # and PLAY_UPLOAD_PASSWORD) the bundle is signed with a throwaway key, only to check that it builds and signs.
      - name: Build the Google Play bundle
        working-directory: mobile
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
        run: |
          briefcase package android -p aab --no-input
          AAB=$(ls dist/*.aab | head -1)
          if [ "$HAS_PLAY_KEY" = "true" ]; then
            echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > upload.p12
          else
            pip install cryptography
            export PLAY_UPLOAD_PASSWORD=throwaway-ci-key
            python -c "import sys; sys.path.insert(0, 'play'); import make_upload_key as m; open('upload.p12', 'wb').write(m.make_key(b'throwaway-ci-key'))"
          fi
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -storetype pkcs12 -keystore upload.p12 -storepass:env PLAY_UPLOAD_PASSWORD "$AAB" upload
          jarsigner -verify "$AAB"
          rm upload.p12
          mkdir -p ../out-play
          if [ "$HAS_PLAY_KEY" = "true" ]; then cp "$AAB" "../out-play/Beedo-Trade-${VERSION}-play.aab"; fi
      - name: Attach the Play bundle to the release
        if: env.HAS_PLAY_KEY == 'true' && (github.event_name == 'release' || inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" out-play/*.aab --clobber
      - uses: actions/upload-artifact@v4
        if: env.HAS_PLAY_KEY == 'true'
        with:
          name: Beedo-Trade-play-bundle
          path: out-play/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Beedo-Trade-android
          path: out/*.apk
          if-no-files-found: error

  # Opens the APK in an Android emulator, prints the app's log and what is on screen, and fails if the app crashes
  # or its engine never starts. The APK is attached to the release only when this passes.
  test:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Beedo-Trade-android
          path: out
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Open the app in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r out/*.apk
            adb shell pm grant io.github.beedoelomda.beedotrade android.permission.POST_NOTIFICATIONS
            adb shell run-as io.github.beedoelomda.beedotrade mkdir -p files
            adb shell run-as io.github.beedoelomda.beedotrade touch files/beedo_test_alerts
            adb logcat -c
            adb shell monkey -p io.github.beedoelomda.beedotrade -c android.intent.category.LAUNCHER 1
            sleep 45
            adb logcat -d > logcat.txt || true
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui.xml || true
            echo "===== crash =====" && (grep -A40 "FATAL EXCEPTION" logcat.txt | head -60 || true)
            echo "===== python =====" && (grep -E "python\.std(out|err)" logcat.txt | head -80 || true)
            echo "===== app log =====" && (grep -E "beedo|Beedo|ANR in|has died" logcat.txt | head -40 || true)
            echo "===== on screen =====" && (grep -o 'text="[^"]\+"' ui.xml | head -60 || true)
            grep -A12 "FATAL EXCEPTION" logcat.txt | sed 's/^.*AndroidRuntime: //' | head -12 | while IFS= read -r l; do echo "::error title=crash::$l"; done
            grep "python.stderr" logcat.txt | sed 's/^.*python.stderr: //' | tail -10 | while IFS= read -r l; do echo "::warning title=python::$l"; done
            adb shell dumpsys notification --noredact > notif.txt || true
            echo "===== notifications =====" && (grep -E "pkg=io.github.beedoelomda|android.title=|android.text=" notif.txt | head -20 || true)
            echo "===== alert job =====" && (grep -E "Beedo-Trade alert check|BeedoAlerts" logcat.txt | head -10 || true)
            grep -E "Beedo-Trade alert check|BeedoAlerts" logcat.txt | head -5 | while IFS= read -r l; do echo "::notice title=alert job::$l"; done
            ! grep -q "FATAL EXCEPTION" logcat.txt
            grep -q "Beedo-Trade developer mode" logcat.txt
            grep -q "Beedo-Trade alert check" logcat.txt
            grep -q "pkg=io.github.beedoelomda.beedotrade" notif.txt
            # System theme (the default): with the phone in dark mode the app must open dark
            adb shell cmd uimode night yes
            adb shell am force-stop io.github.beedoelomda.beedotrade
            adb shell monkey -p io.github.beedoelomda.beedotrade -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > night.png
            pip install -q pillow
            python3 -c "from PIL import Image, ImageStat; im = Image.open('night.png').convert('L'); w, h = im.size; v = ImageStat.Stat(im.crop((w // 4, h * 3 // 10, w * 3 // 4, h * 7 // 10))).mean[0]; print(f'::notice title=dark mode::middle of the screen brightness {v:.0f} of 255 (dark below 110)'); raise SystemExit(0 if v < 110 else 'The app did not follow the phone dark mode')"
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # this job has no checkout, so gh needs the repository named
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # --clobber: a rebuilt (fixed) test APK replaces the one already attached under the same name
        run: gh release upload "$TAG" out/*.apk --clobber
