# Beedo-Trade phone app, packaged with BeeWare Briefcase.
# The build (.github/workflows/build-android.yml) first copies app/beedo_app to src/beedo_app and the skill
# scripts to src/beedotrade/engine, so the phone runs exactly the desktop engine. Version comes from app/pyproject.toml.
[tool.briefcase]
project_name = "Beedo-Trade"
bundle = "io.github.beedoelomda"
version = "0.0.0"
url = "https://github.com/BeedoElOmda/Beedo-Trade"
license.file = "LICENSE"
author = "BeedoElOmda"

[tool.briefcase.app.beedotrade]
formal_name = "Beedo-Trade"
description = "Egyptian Exchange (EGX) technical analysis with the Beedo course method"
sources = ["src/beedotrade", "src/beedo_app"]
requires = ["certifi"]
icon = "icons/beedotrade"  # PNGs made from app/packaging/icon.png by make_icons.py
splash_background_color = "#1D45A7"  # splash screen and adaptive-icon background

[tool.briefcase.app.beedotrade.android]
requires = ["toga-android~=0.5.0"]
base_theme = "Theme.MaterialComponents.DayNight.DarkActionBar"  # follows the phone's dark mode, so the page's System theme can too
build_gradle_dependencies = [
    "com.google.android.material:material:1.12.0",
    "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
    "androidx.webkit:webkit:1.15.0",
    "androidx.work:work-runtime:2.9.1",  # the daily alert check (mobile/android/AlertWorker.java)
]
# Toga's Android web view uses a Python class that Java must see (Toga WebView notes); the engine's server reads
# its web pages from disk, so both packages are unpacked onto the phone instead of staying inside the APK
build_gradle_extra_content = """
chaquopy.defaultConfig.staticProxy("toga_android.widgets.internal.webview")
chaquopy.defaultConfig.extractPackages("beedo_app", "beedotrade")
"""
# The app talks to its own engine at http://127.0.0.1 (plain HTTP inside the phone)
android_manifest_application_attrs_extra_content = 'android:usesCleartextTraffic="true"'
